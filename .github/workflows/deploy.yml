name: Deploy

# Build the image, push to ECR, and roll the ECS service — on merge to main.
# Skips cleanly (warns, doesn't fail) until AWS credentials are configured, so
# the pipeline is safe to merge before the infra exists.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# OIDC: the job trades GitHub's token for short-lived AWS credentials. Without id-token: write the
# role cannot be assumed, and with no stored AWS keys there is nothing else to fall back on.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: prod-saas-prod
  ECS_CLUSTER: prod-saas-prod
  ECS_SERVICE: prod-saas-prod
  TASK_FAMILY: prod-saas-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check AWS credentials are configured
        id: creds
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_ROLE_ARN not set — skipping deploy. Add it (OIDC role) to enable CD."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.creds.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push the image, tagged with the commit
        if: steps.creds.outputs.configured == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # The repository's tags are immutable: one tag per commit, never :latest again.
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # A new task definition revision with only the image changed, so CPU, memory, secrets and
      # roles stay what Terraform set. Rolling back is pointing the service at an older revision.
      - name: Register a task definition revision with the new image
        if: steps.creds.outputs.configured == 'true'
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # The family's latest revision, not the one the service runs: it carries the newest settings
          # Terraform applied (CPU, env, secrets), which the service would otherwise never pick up.
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition \
            | jq --arg image "$IMAGE" '.containerDefinitions |= map(if .name == "app" then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' \
            > taskdef.json
          arn=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Roll the ECS service and wait until it is stable
        if: steps.creds.outputs.configured == 'true'
        env:
          TASKDEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASKDEF" >/dev/null
          # Fails the job if the new tasks do not become healthy (about 10 minutes).
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deployed $TASKDEF to $ECS_SERVICE."
