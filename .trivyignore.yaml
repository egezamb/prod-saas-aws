# Findings accepted on purpose (docs/DECISIONS.md, "Accepted scanner findings"). Each one is scoped
# to the file it is about, so the same finding elsewhere still fails CI.
misconfigurations:
  - id: AWS-0053
    paths: ["terraform/alb.tf"]
    statement: The ALB is the public front door.
  - id: AWS-0054
    paths: ["terraform/alb.tf"]
    statement: HTTP is served only when no certificate_arn is given; with one, port 80 redirects to HTTPS.
  - id: AWS-0104
    paths: ["terraform/security.tf"]
    statement: Tasks reach ECR, Secrets Manager and CloudWatch on 443 through the NAT gateway; VPC endpoints would remove this at their own hourly cost.
